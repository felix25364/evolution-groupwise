<!doctype html><html><head><meta charset="utf-8"><title>GroupWise account</title></head>
<body><h1>GroupWise account</h1><p>Experimental Linux integration. Mail sending is not supported.</p>
<div id="accounts"></div>
<form id="setup"><p><label>Server <input name="host" required></label></p>
<p><label>Port <input name="port" type="number" min="1" max="65535" value="7191" required></label></p>
<p><label>Username <input name="username" required autocomplete="username"></label></p>
<p><label>Password <input name="password" type="password" required autocomplete="current-password"></label></p>
<p><label><input name="tls" type="checkbox" checked> Use TLS (certificate verification required)</label></p>
<button>Create account</button></form><p id="status" role="status"></p><script src="setup.js"></script></body></html>
